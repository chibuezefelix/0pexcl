<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>opxl — software for african enterprise</title>
  <meta name="description" content="opxl builds bespoke software and digital infrastructure for enterprise — fintech, mobile, cloud, and ai." />

  <!-- favicon -->
  <link rel="icon" type="image/png" href="opxl-logo.png" />
  <link rel="apple-touch-icon" href="opxl-logo.png" />
  <link rel="shortcut icon" type="image/png" href="opxl-logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ---------- reset & base ---------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0a0a0a;
      --paper: #fafafa;
      --mute: #6b6b6b;
      --hair: #e6e6e6;
      --font-display: "Geist", -apple-system, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, monospace;
      --max-w: 1280px;
    }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      font-family: var(--font-display);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-weight: 400;
      letter-spacing: -0.005em;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; background: none; border: none; cursor: pointer; color: inherit; }

    /* ---------- top nav ---------- */
    header {
      width: 100%;
      padding: 22px 48px;
    }

    .header-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 32px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      justify-self: start;
      animation: fade 0.7s ease backwards;
    }
    .brand img {
      height: 38px;
      width: auto;
      display: block;
    }

    nav.top {
      display: flex;
      align-items: center;
      gap: 36px;
      flex-wrap: wrap;
      justify-self: center;
      justify-content: center;
    }

    nav.top a {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      position: relative;
      padding: 4px 0;
      transition: opacity 0.2s ease;
    }

    nav.top a:hover { opacity: 0.55; }

    nav.top a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -2px;
      width: 0;
      height: 1px;
      background: var(--ink);
      transition: width 0.25s ease, left 0.25s ease;
    }
    nav.top a:hover::after { width: 100%; left: 0; }

    /* ---------- hero ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 48px;
      text-align: center;
    }

    .mark-img {
      margin-bottom: 56px;
      animation: fade 0.9s ease 0.2s backwards;
    }
    .mark-img img {
      width: 94px;
      height: 94px;
      object-fit: contain;
      display: block;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1.tagline {
      font-size: clamp(28px, 4.5vw, 56px);
      font-weight: 400;
      line-height: 1.08;
      letter-spacing: -0.025em;
      max-width: 18ch;
      animation: fade 0.9s ease 0.5s backwards;
    }

    p.sub {
      margin-top: 28px;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mute);
      animation: fade 0.9s ease 0.7s backwards;
    }

    p.sub span { display: inline-block; margin: 0 6px; }
    p.sub .dot { color: var(--ink); }

    @keyframes fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---------- footer products ---------- */
    footer {
      width: 100%;
      padding: 56px 48px 72px;
    }

    .products {
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 56px;
      flex-wrap: wrap;
    }

    .products button {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink);
      position: relative;
      padding: 6px 0;
      transition: opacity 0.2s ease;
    }

    .products button:hover { opacity: 0.55; }

    .products button::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--ink);
      transition: width 0.25s ease, left 0.25s ease;
    }
    .products button:hover::after { width: 100%; left: 0; }

    /* ---------- toast (coming soon) ---------- */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--paper);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 14px 22px;
      border-radius: 2px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ---------- responsive ---------- */
    @media (max-width: 860px) {
      header { padding: 18px 20px; }
      main { padding: 60px 20px; }
      footer { padding: 40px 20px 56px; }

      .header-inner {
        grid-template-columns: 1fr;
        align-items: center;
        gap: 18px;
      }
      .brand { justify-self: center; }
      .brand img { height: 32px; }
      .header-spacer { display: none; }

      nav.top { gap: 16px 22px; justify-content: center; }
      nav.top a { font-size: 10px; letter-spacing: 0.12em; }

      .products { gap: 24px 32px; }
      .products button { font-size: 10px; }

      .mark-img { margin-bottom: 44px; }
      .mark-img img { width: 76px; height: 76px; }

      h1.tagline { font-size: 30px; }
      p.sub { font-size: 10px; }
    }

    /* selection */
    ::selection { background: var(--ink); color: var(--paper); }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="brand" aria-label="opxl home">
        <img src="opxl-logo.png" alt="opxl" />
      </a>
      <nav class="top" aria-label="primary">
        <a href="#news">News</a>
        <a href="#about">About</a>
        <a href="#solutions">Solutions</a>
        <a href="#fintech">Fintech</a>
        <a href="#enterprise">Enterprise</a>
        <a href="#ai">AI</a>
        <a href="#careers">Careers</a>
        <a href="#legal">Legal</a>
        <a href="#privacy">Privacy</a>
      </nav>
      <div class="header-spacer" aria-hidden="true"></div>
    </div>
  </header>

  <main>
    <div class="mark-img" aria-hidden="true">
      <img src="opxl-logo.png" alt="opxl limited" />
    </div>

    <h1 class="tagline">opxl builds the digital infrastructure of african enterprise</h1>

    <p class="sub">
      <span>Enterprise Software</span><span class="dot">·</span>
      <span>Fintech</span><span class="dot">·</span>
      <span>Mobile</span><span class="dot">·</span>
      <span>Cloud</span><span class="dot">·</span>
      <span>AI</span>
    </p>
  </main>

  <footer>
    <div class="products" role="group" aria-label="products">
      <button data-product="Caredose App" data-url="https://www.caredoseapp.com">Caredose App</button>
      <button data-product="SpendSpace App">SpendSpace App</button>
      <button data-product="KipChange">KipChange</button>
      <button data-product="Ate Events">Ate Events</button>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite">Coming soon</div>

  <script>
    (function () {
      const toast = document.getElementById('toast');
      let hideTimer;

      document.querySelectorAll('.products button').forEach(btn => {
        btn.addEventListener('click', () => {
          const url = btn.getAttribute('data-url');

          // if the product has a real link, open it in a new tab
          if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
            return;
          }

          // otherwise show the "coming soon" toast
          const name = btn.getAttribute('data-product') || 'Coming soon';
          toast.textContent = name + ' — Coming soon';
          toast.classList.add('show');
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        });
      });
    })();
  </script>

</body>
</html>
